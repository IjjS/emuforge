# The spec of the real-Cloudscape fixture (main.js beside it): every component the matching rules of
# requirement 5.2 assume, one item kind each. Needs both states (table.empty, single selection).
screen: s3.cloudscape-fixture
service: s3
kind: table
route: /s3/buckets

breadcrumbs: [Amazon S3, Buckets]
header:
  title: General purpose buckets
  counter: true
  actions: [Empty, Delete, Create bucket]
  primary_action: Create bucket
table:
  selection: single
  filter: text
  pagination: true
  columns: [Name, AWS Region, Creation date]
  empty:
    title: No buckets
    action: Create bucket
tabs: [Objects, Properties]
sections:
  - title: General configuration
    fields: [Bucket name, Bucket type]
  - title: Bucket details
    fields: [Owner, Versioning]
