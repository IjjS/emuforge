# The spec of the real-Cloudscape wizard fixture (main.js beside it): three steps, each with a Container whose
# Header is the section title and FormField labels as fields, the breadcrumbs, and the submit button.
screen: iam.cloudscape-wizard-fixture
service: iam
kind: wizard
route: /aws/iam/roles/create

breadcrumbs: [IAM, Roles, Create role]
steps:
  - title: Select trusted entity
    sections:
      - title: Trusted entity type
        fields: [Use case, Service]
  - title: Add permissions
    sections:
      - title: Permissions policies
        fields: [Policy name]
  - title: Name, review, and create
    sections:
      - title: Role details
        fields: [Role name, Description]
submit: Create role
