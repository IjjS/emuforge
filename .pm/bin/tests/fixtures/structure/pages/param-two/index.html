<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stages | EmuForge</title>
<!-- every item of specs/param-two.yaml for its seeded state at /aws/apigateway/apis/<a>/stages/<b>; a heading
     "Not found" at any other path -->
</head>
<body>
<div class="aws-area" id="area"></div>
<script>
  const SEEDED = `
<nav aria-label="Breadcrumbs">
  <ol>
    <li><a href="/aws/apigateway">API Gateway</a></li>
    <li><a href="/aws/apigateway/apis">APIs</a></li>
    <li><span>Stages</span></li>
  </ol>
</nav>
<main>
  <h1>Stages</h1>
  <table aria-label="Stages">
    <thead><tr><th>Stage name</th><th>Deployment ID</th></tr></thead>
    <tbody>
      <tr><td>prod</td><td>fixture-deployment</td></tr>
    </tbody>
  </table>
</main>`;
  const NOT_FOUND = `
<main>
  <h1>Not found</h1>
</main>`;
  const found = /^\/aws\/apigateway\/apis\/[^/]+\/stages\/[^/]+$/.test(location.pathname);
  document.getElementById("area").innerHTML = found ? SEEDED : NOT_FOUND;
</script>
</body>
</html>
