<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Buckets | EmuForge</title>
<!-- state empty: no rows, the empty title and its action inside the table -->
</head>
<body>
<div class="aws-area">
<nav aria-label="Breadcrumbs">
  <ol>
    <li><a href="/s3">Amazon S3</a></li>
    <li><a href="/s3/buckets">Buckets</a></li>
  </ol>
</nav>
<main>
  <h1>General purpose buckets <span>(0)</span></h1>
  <button type="button">Empty</button>
  <button type="button">Delete</button>
  <button type="button">Create bucket</button>
  <input type="search" aria-label="Find buckets by name">
  <ul>
    <li><button type="button" aria-label="Previous page">&lt;</button></li>
    <li><button type="button">1</button></li>
    <li><button type="button" aria-label="Next page">&gt;</button></li>
  </ul>
  <table aria-label="General purpose buckets">
    <thead><tr><th></th><th>Name</th><th>AWS Region</th><th>Creation date</th></tr></thead>
    <tbody>
      <tr><td colspan="4"><b>No buckets</b> <span>You don't have any buckets.</span> <button type="button">Create bucket</button></td></tr>
    </tbody>
  </table>
</main>
</div>
</body>
</html>
