<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Create role | EmuForge</title>
<!-- renders step <k> at ?step=<k>; Use case is required on step 1 and Next shows an error instead of moving on -->
</head>
<body>
<main>
  <nav aria-label="Breadcrumbs">
    <ol>
      <li><a href="/aws/iam">IAM</a></li>
      <li><a href="/aws/iam/roles">Roles</a></li>
      <li><a href="/aws/iam/roles/create">Create role</a></li>
    </ol>
  </nav>
  <nav aria-label="Steps"><ol id="steps"></ol></nav>
  <form id="step" novalidate></form>
</main>
<script>
  // the markup of the probe (requirement 8): one button per step named "Step <n>: <title>" in the navigation
  // Steps, the active step's title as a heading, its sections as headings with labelled inputs, the form's buttons
  const STEPS = [
    { title: "Select trusted entity", sections: [["Trusted entity type", ["Use case", "Service"]]],
      buttons: ["Cancel", "Next"] },
    { title: "Add permissions", sections: [["Permissions policies", []]], buttons: ["Cancel", "Previous", "Next"] },
    { title: "Name, review, and create", sections: [], buttons: ["Cancel", "Previous", "Create role"] },
  ];
  const asked = parseInt(new URLSearchParams(location.search).get("step") || "1", 10) || 1;
  const step = STEPS[Math.max(1, Math.min(STEPS.length, asked)) - 1];
  const nav = document.getElementById("steps");
  STEPS.forEach((s, i) => {
    const li = document.createElement("li");
    const n = document.createElement("span");
    n.textContent = "Step " + (i + 1);
    const b = document.createElement("button");
    b.type = "button";
    b.setAttribute("aria-label", "Step " + (i + 1) + ": " + s.title);
    b.textContent = s.title;
    li.append(n, b);
    nav.appendChild(li);
  });
  const form = document.getElementById("step");
  const h1 = document.createElement("h1");
  h1.textContent = step.title;
  form.appendChild(h1);
  step.sections.forEach(([title, fields], si) => {
    const h2 = document.createElement("h2");
    h2.textContent = title;
    form.appendChild(h2);
    fields.forEach((label, fi) => {
      const id = "f" + si + "-" + fi;
      const l = document.createElement("label");
      l.htmlFor = id;
      l.textContent = label;
      const input = document.createElement("input");
      input.id = id;
      form.append(l, input);
    });
  });
  step.buttons.forEach((name) => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = name;
    form.appendChild(b);
  });
  if (step === STEPS[0]) {
    const input = document.getElementById("f0-0");
    input.required = true;
    const next = [...form.querySelectorAll("button")].find((b) => b.textContent === "Next");
    next.addEventListener("click", () => {
      if (!input.value) {
        const p = document.createElement("p");
        p.setAttribute("role", "alert");
        p.textContent = "Use case is required.";
        form.appendChild(p);
      }
    });
  }
</script>
</body>
</html>
