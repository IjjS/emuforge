# The wizard spec of requirement 3 without its omitted entry: 16 items (requirement 5.1, worked example).
# Critical: the three step titles and submit. The field Use case carries control: input (not scored).
screen: iam.create-role
service: iam
kind: wizard
route: /aws/iam/roles/create          # no ? and no #: the tool adds ?step=<k>

breadcrumbs: [IAM, Roles, Create role]
steps:                                 # in order
  - title: Select trusted entity
    sections:
      - title: Trusted entity type
        fields:
          - label: Use case
            control: input
          - Service
  - title: Add permissions
    sections:
      - title: Permissions policies
  - title: Name, review, and create
submit: Create role                    # the last step's primary button
