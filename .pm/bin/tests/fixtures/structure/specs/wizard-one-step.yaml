# wizard.yaml with two steps omitted: 1 shown step, Name, review, and create.
screen: iam.create-role
service: iam
kind: wizard
route: /aws/iam/roles/create

breadcrumbs: [IAM, Roles, Create role]
steps:
  - title: Select trusted entity
    sections:
      - title: Trusted entity type
        fields:
          - label: Use case
            control: input
          - Service
  - title: Add permissions
    sections:
      - title: Permissions policies
  - title: Name, review, and create
submit: Create role

omitted:
  - item: steps[Select trusted entity]
    reason: the emulator trusts every principal the same way
  - item: steps[Add permissions]
    reason: the emulator has no managed policies to attach
