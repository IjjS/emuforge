# Ten items in state seeded: breadcrumbs[Service], breadcrumbs.order, header.title,
# header.actions[Create thing], header.actions.order, header.primary_action, table.filter,
# table.columns[Name], table.columns[Status], table.columns.order.
# Critical: the title, the primary action and the columns. Non-critical lists of one entry:
# breadcrumbs and header.actions. List of two entries: table.columns.
screen: s3.ten-items
service: s3
kind: table
route: /s3/ten-items

breadcrumbs: [Service]
header:
  title: Things
  actions: [Create thing]
  primary_action: Create thing
table:
  filter: text
  columns: [Name, Status]
