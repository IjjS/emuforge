# Issue 302: a table screen whose route holds two parameters; table.empty makes it require both states.
screen: apigateway.stage-list
service: apigateway
kind: table
route: /aws/apigateway/apis/{api}/stages/{stage}

breadcrumbs: [API Gateway, APIs, Stages]
header:
  title: Stages
table:
  columns: [Stage name, Deployment ID]
  empty:
    title: No stages
    action: Create stage
