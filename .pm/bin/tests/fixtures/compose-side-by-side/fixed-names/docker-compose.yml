# Fixture of harness.compose-side-by-side (issue #6), only ever rendered with `config`: the shape of the Compose file
# before issue #6, the same project and container name for every port. The identity guard must refuse it.
name: emuforge
services:
  aws-emulator:
    image: emuforge-test-missing-image-6
    container_name: emuforge-aws-emulator
    command: ["-p", "${EMULATOR_PORT:-9297}", "-t", "off"]
    ports:
      - "127.0.0.1:${EMULATOR_PORT:-9297}:${EMULATOR_PORT:-9297}"
