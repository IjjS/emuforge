# Fixture of harness.compose-side-by-side (issue #6), never started: its image does not exist locally, so a start
# must fail with an error before anything runs. The names follow the per-port naming of the shipped file.
name: emuforge${EMULATOR_PORT:+-${EMULATOR_PORT}}
services:
  aws-emulator:
    image: emuforge-test-missing-image-6
    container_name: emuforge-aws-emulator${EMULATOR_PORT:+-${EMULATOR_PORT}}
    command: ["-p", "${EMULATOR_PORT:-9297}", "-t", "off"]
    ports:
      - "127.0.0.1:${EMULATOR_PORT:-9297}:${EMULATOR_PORT:-9297}"
