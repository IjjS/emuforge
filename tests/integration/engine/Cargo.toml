# Integration checks for the engine, run by tests/integration/run against a real aws-emulator.
# Its own workspace and lock file, so these dependencies never enter the engine's.
[package]
name = "emuforge-integration-engine"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dev-dependencies]
# Parse the engine's health and error bodies and write verdict files.
serde_json = "=1.0.154"
# Find this host's non-loopback IPv4 address for engine.binds-loopback-only.
if-addrs = "=0.15.0"
# Reference SigV4 signer for the requests the relay checks send, independent of the engine's own signer.
aws-sigv4 = { version = "=1.6.5", default-features = false, features = ["sign-http", "http1"] }
aws-credential-types = "=1.3.1"
# TLS for requests sent straight to the emulator, trusting only its ca.pem.
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "=1.16.0", features = ["std"] }
# CRC32 of response bodies, compared with x-amz-crc32, and of aws-chunked trailers.
crc32fast = "=1.5.5"

[lints.rust]
unsafe_code = "forbid"
