# The check of `main` (issue 53). Every push of `main` runs, on an Ubuntu runner hosted by GitHub, the nine
# commands of pm-check's engine, studio and integration steps (`.pm/bin/pm-check`, STEPS), each in its folder,
# each as a step named after the pm-check step, through `.github/ci run`, which starts it without pm-check's
# SCRUB names and replaces every run of a key's shape in what it prints (the repository is public, so is the log).
# The integration step leaves out what `.github/not-run.json` lists; the step `not-run` prints that list.
#
# Services (issue 327, R5). The integration steps hold every check of no service and the browser checks of the
# services the push touched: the step `services` (`.github/ci services`) reads the paths of every commit of the
# push, from the commit `main` had before it to the pushed commit, decides them with `.pm/bin/pm-scope --push`
# and writes `output/ci/services.json`, which both integration runs pass to `run --services`. A run not started by
# a push, a first or forced push, or git that cannot answer is every service. The checkout fetches the whole
# history so that the commit before the push is there. The checks of a service no push touches run only in
# `full.yml`, which the owner starts by hand. The checks of the tier full (issue 482, the manifest's label `full`)
# run only there: this workflow never passes `--full`, so each is `not-run`, whatever the push touched.
#
# A failed step does not stop the later ones of the nine. No step runs a second time (issue 569): a step that
# fails has failed, and the run is a success only when each of the nine exited 0.
#
# Rights: the token reads the repository's contents and nothing else; no secret is named, nothing is uploaded,
# cached or published, and every action is one of GitHub's own, named by commit sha. No text from outside the
# repository is put into a `run:` line.
#
# Time, as the first trial run took it (run 43861083645, nothing cached): preparing 1.2 minutes, the engine
# steps 0.6, the Studio steps 0.7, integration 8.7. The integration step took 22m 19s with every service selected
# in run 44893383185, so its 45-minute bound is at least twice that measured time. The job has 80 minutes and
# each other step of the nine has 15, so one hung step cannot use up the job's time. Every preparing step has
# a bound too (10 for checkout and node), so that `full.yml` holds the same text for the steps it shares.
name: main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - name: checkout
        timeout-minutes: 10
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: node
        timeout-minutes: 10
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: not-run
        timeout-minutes: 5
        run: .github/ci not-run

      - name: services
        timeout-minutes: 5
        run: .github/ci services

      - name: versions
        id: versions
        timeout-minutes: 5
        run: .github/ci versions >> "$GITHUB_OUTPUT"

      - name: rust
        timeout-minutes: 10
        env:
          RUST_VERSION: ${{ steps.versions.outputs.rust }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt --component clippy
          rustup default "$RUST_VERSION"
          cargo --version

      - name: bun
        timeout-minutes: 10
        env:
          BUN_VERSION: ${{ steps.versions.outputs.bun }}
        run: |
          npm install --global "bun@$BUN_VERSION"
          bun --version

      - name: tools
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends lsof
          for tool in lsof mkfifo shasum curl docker python3 cargo bun node; do
            command -v "$tool" > /dev/null || { echo "missing tool: $tool"; exit 1; }
          done
          docker compose version

      - name: studio dependencies
        timeout-minutes: 10
        working-directory: studio
        run: bun install --frozen-lockfile

      - name: chromium
        timeout-minutes: 15
        working-directory: studio
        run: node_modules/.bin/playwright install --with-deps chromium

      # The emulator runs as the owner of this folder (infra/aws-emulator/entrypoint.sh); made here so that it is
      # the runner's and not root's, which Docker Engine would make it.
      - name: emulator image
        timeout-minutes: 15
        run: |
          mkdir -p "$HOME/.aws/emulator"
          echo "runner uid $(id -u)"
          docker compose -f infra/aws-emulator/docker-compose.yml build

      - name: engine-fmt
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        working-directory: engine
        run: ../.github/ci run -- cargo fmt --all --check

      - name: engine-clippy
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        working-directory: engine
        run: ../.github/ci run -- cargo clippy --workspace --all-targets -- -D warnings

      - name: engine-test
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        working-directory: engine
        run: ../.github/ci run -- cargo test --workspace


      - name: studio-typecheck
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        working-directory: studio
        run: ../.github/ci run -- bun run typecheck

      - name: studio-lint
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        working-directory: studio
        run: ../.github/ci run -- bun run lint

      - name: studio-format
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        working-directory: studio
        run: ../.github/ci run -- bun run format:check

      - name: studio-unit
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        working-directory: studio
        run: ../.github/ci run -- bun run test:unit --fsModuleCache=false


      - name: studio-build
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        working-directory: studio
        run: ../.github/ci run -- bun run build

      - name: integration
        if: ${{ !cancelled() }}
        timeout-minutes: 45
        working-directory: tests/integration
        run: ../../.github/ci run --tails -- ./run --not-run ../../.github/not-run.json --services ../../output/ci/services.json
