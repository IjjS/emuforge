# The product form's gateway (issue 34, design D2 and 2.3): TCP byte transport across the network namespace that the
# gateway, the engine and Studio's server share. It never terminates TLS, reads no HTTP and holds no key.
#
#   0.0.0.0:18296               -> 127.0.0.1:EMUFORGE_STUDIO_PORT          the published Studio port to Studio's server
#   0.0.0.0:18297               -> 127.0.0.1:EMUFORGE_ENGINE_PORT          the published engine port to the engine
#   127.0.0.1:EMULATOR_PORT     -> host.docker.internal:EMULATOR_PORT      the engine to the host's emulator (TLS bytes)
#
# 18296 and 18297 are the gateway's own inside the namespace; Docker publishes them on host 127.0.0.1 only. The ports
# come from the environment, which HAProxy expands itself. Logs go to stdout: connection lines only, which in TCP
# mode hold addresses, byte counts and timers, never payload.

global
    log stdout format raw local0 info
    # With EMULATOR_PORT equal to the engine or the Studio port, emulator_out would hold the port the engine or
    # Studio's server cannot bind, and the published port would loop back through the host into the gateway. Refuse
    # it at start, naming the port, so nothing listens.
    .if streq("${EMULATOR_PORT}","${EMUFORGE_ENGINE_PORT}")
        .alert "EMULATOR_PORT and EMUFORGE_ENGINE_PORT are both ${EMULATOR_PORT}; they must differ"
    .endif
    .if streq("${EMULATOR_PORT}","${EMUFORGE_STUDIO_PORT}")
        .alert "EMULATOR_PORT and EMUFORGE_STUDIO_PORT are both ${EMULATOR_PORT}; they must differ"
    .endif
    # Without it HAProxy lets its own listeners share a port, so an EMULATOR_PORT of 18296 or 18297 would start;
    # with it the second bind fails and the gateway exits naming the port.
    noreuseport
    maxconn 1024

defaults
    mode tcp
    log global
    option tcplog
    # The engine's own connect deadline.
    timeout connect 2s
    # One attempt per connection, so a refused upstream closes the engine's connection at once.
    retries 0
    # Longer than every bound the engine and Studio's server set, so the gateway never ends a live exchange.
    timeout client 1h
    timeout server 1h

frontend studio_in
    bind 0.0.0.0:18296
    default_backend studio

backend studio
    server studio "127.0.0.1:${EMUFORGE_STUDIO_PORT}"

frontend engine_in
    bind 0.0.0.0:18297
    default_backend engine

backend engine
    server engine "127.0.0.1:${EMUFORGE_ENGINE_PORT}"

frontend emulator_out
    bind "127.0.0.1:${EMULATOR_PORT}"
    default_backend emulator

backend emulator
    server emulator "host.docker.internal:${EMULATOR_PORT}"
