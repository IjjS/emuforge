# EmuForge as a product on Docker Engine on Linux (issue 54): the host form. Used alone, in place of the root
# docker-compose.yml, which stays the form of Docker Desktop. `./compose up` and `./compose down` pick this file
# by themselves; the plain commands are:
#
# An emulator already running on EMULATOR_PORT:
#   docker compose -f docker-compose.linux.yml up -d --build
#   docker compose -f docker-compose.linux.yml down
# No emulator: the same start also brings one up, and only its own stop removes it:
#   docker compose -f docker-compose.linux.yml --profile emulator up -d --build
#   docker compose -f docker-compose.linux.yml --profile emulator down
#
# Before either start: the folder must exist, and the form runs as the user (both are done by ./compose):
#   mkdir -p ~/.aws/emulator
#   export EMUFORGE_UID="$(id -u)" EMUFORGE_GID="$(id -g)"
#
# There is no gateway. The engine and Studio's server run in the host's network namespace, where they bind
# 127.0.0.1 in their own code, and the engine reaches the emulator at 127.0.0.1:EMULATOR_PORT like the developer's
# start does. Nothing of the form publishes a port but the emulator of the profile, on 127.0.0.1 only. 18296 and
# 18297 are ordinary ports here. Every service takes what it shares with the root file's service of the same name
# by `extends` and states only what differs. `!reset` needs Docker Compose 2.24 or later.
#
# EMUFORGE_UID and EMUFORGE_GID (1000 each when unset, the image's own user) are the ids the form's processes run
# as: the user's, so the engine can read the emulator's 0600 files. Never 0.
#
# No bind of this file creates ~/.aws/emulator (create_host_path: false): a folder Docker Engine creates belongs
# to root. With the folder missing the start fails with Docker's message naming it.

# The root file's project name: the same project for the same Studio port on both platforms.
name: emuforge-app${EMUFORGE_STUDIO_PORT:+-${EMUFORGE_STUDIO_PORT}}

services:
  engine:
    extends:
      file: docker-compose.yml
      service: engine
    # In place of the gateway's namespace: the process's 127.0.0.1 is the host's.
    network_mode: host
    # There is no gateway to wait for.
    depends_on: !reset []
    user: "${EMUFORGE_UID:-1000}:${EMUFORGE_GID:-1000}"
    volumes:
      # The root file's mount, same target, which this one replaces: the emulators' directory, read-only, and
      # never created by Docker.
      - type: bind
        source: ${HOME}/.aws/emulator
        target: /home/emuforge/.aws/emulator
        read_only: true
        bind:
          create_host_path: false

  studio:
    extends:
      file: docker-compose.yml
      service: studio
    network_mode: host
    depends_on: !reset []
    user: "${EMUFORGE_UID:-1000}:${EMUFORGE_GID:-1000}"

  aws-emulator:
    profiles: [emulator]
    extends:
      file: docker-compose.yml
      service: aws-emulator
    volumes:
      # The emulator's own mount, same target, which this one replaces, never created by Docker.
      - type: bind
        source: ${HOME}/.aws/emulator
        target: ${HOME}/.aws/emulator
        bind:
          create_host_path: false
