[package]
name = "emuforge-server"
description = "The EmuForge engine server: serves the engine's own routes on loopback"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "emuforge-server"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
emuforge-core.workspace = true
getrandom.workspace = true
http-body.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "rt-multi-thread"] }
tower.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
http-body-util.workspace = true
hyper.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "test-util"] }
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
