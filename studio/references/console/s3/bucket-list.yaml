# Reference spec of the S3 bucket list: the AWS console's "Buckets" page with the tab "General purpose buckets".
# Sources: the owner's captures of the English console, docs/aws-console/s3/02-general-purpose-buckets (every item
# but table.empty) and docs/aws-console/s3/03-directory-buckets (table.empty: the same page's empty table).
# Emulator evidence of `omitted`: aws-emulator 1.0.364, written out in each reason.
screen: s3.bucket-list
service: s3
kind: table
route: /aws/s3/buckets

breadcrumbs: [EmuForge, AWS, S3, Buckets]
header:
  title: General purpose buckets
  counter: true
  actions: [Refresh Buckets, Copy ARN, Empty, Delete, Create bucket]
  primary_action: Create bucket
table:
  selection: single
  filter: text
  pagination: true
  columns: [Name, AWS Region, Creation date]
  empty:
    title: No buckets
    action: Create bucket
tabs: [General purpose buckets, Directory buckets]
sections:
  - title: Account snapshot
  - title: External access summary

omitted:
  - item: sections[Account snapshot]
    reason: "The panel shows the account's Storage Lens metrics. GetStorageLensConfiguration for default-account-dashboard answers 404 NoSuchConfiguration on a fresh emulator; after PutStorageLensConfiguration (204) with that id, IsEnabled true and DataExport.CloudWatchMetrics.IsEnabled true, and an object stored, cloudwatch ListMetrics for AWS/S3/Storage-Lens and for AWS/S3 answers 200 with no metric, and no S3 control operation returns or creates one (aws-emulator 1.0.364), so the metrics the panel shows cannot exist"
