# Reference spec of "Empty bucket": the AWS console's page that "Empty" on the bucket list opens for the selected
# bucket, before the emptying is started.
# Sources: no capture shows the page. The AWS user guide (Amazon S3 User Guide, `empty-bucket`) gives the page's
# name, the confirmation by the bucket's name and the button. Each item's source: empty-bucket.sources.md.
# The route names the seeded bucket `structure-bucket` (requirement R13).
# The confirmation field's label is in no source, so it is not an item (requirement R8.1 words it); neither is
# "Cancel". The state "Empty bucket: Status" that follows "Empty" is reached only by operating the page and its
# content is in no source: it is EmuForge's own state, outside this spec (requirement R13).
# The crumbs below "Buckets" are provisional (decisions-needed.md, question 3).
# Nothing is omitted: the emulator (aws-emulator 1.0.481) holds everything these items act on.
screen: s3.empty-bucket
service: s3
kind: form
route: /aws/s3/bucket/structure-bucket/empty

breadcrumbs: [EmuForge, AWS, S3, Buckets, structure-bucket, Empty bucket]
header:
  title: Empty bucket
  actions: [Empty]
  primary_action: Empty
