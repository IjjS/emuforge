# Reference spec of "Delete bucket": the AWS console's page that "Delete" on the bucket list opens for the selected
# bucket, for a bucket that is not empty.
# Sources: no capture shows the page. The AWS user guide (Amazon S3 User Guide, `delete-bucket`) gives the page's
# name, the confirmation by the bucket's name, the button, and the alert "This bucket is not empty" with its
# button "Empty bucket". Each item's source: delete-bucket.sources.md.
# The route names the seeded bucket `structure-bucket`, which holds two objects, so the alert and its action are
# shown; the confirmation field and "Delete bucket" are shown disabled (requirement R7.3, R13).
# A spec has no item for an alert: its action "Empty bucket" is the item, and its header "This bucket is not
# empty" is in the requirement (R7.3). The confirmation field's label is in no source, so it is not an item
# (requirement R7.2 words it); neither is "Cancel".
# The crumbs below "Buckets" are provisional (decisions-needed.md, question 3).
# Nothing is omitted: the emulator (aws-emulator 1.0.481) holds everything these items act on.
screen: s3.delete-bucket
service: s3
kind: form
route: /aws/s3/bucket/structure-bucket/delete

breadcrumbs: [EmuForge, AWS, S3, Buckets, structure-bucket, Delete bucket]
header:
  title: Delete bucket
  actions: [Empty bucket, Delete bucket]
  primary_action: Delete bucket
