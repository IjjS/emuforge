# Reference spec of the Lambda function list: the AWS console's "Event Functions" page.
# Source: the owner's capture of the English console, docs/aws-console/lambda/03-event-functions (the page with
# four functions, its "Actions" menu closed). Each item's source: function-list.sources.md.
# The capture has rows, so it shows no empty list: `table.empty.title` is Studio's own first line and
# `table.empty.action` the header's primary action (requirement R10.1; decisions-needed.md, question 5).
# Nothing is omitted: the emulator (aws-emulator 1.0.481) holds everything these items show.
# Not in this spec: the entries of "Actions" (a menu's entries are not items; requirement R3 row 5) and the
# sorting controls of the column headings (requirement R3 row 9).
screen: lambda.function-list
service: lambda
kind: table
route: /aws/lambda/functions

breadcrumbs: [EmuForge, AWS, Lambda, Event Functions]
header:
  title: Event Functions
  counter: true
  actions: [Refresh, Actions, Create Event Function]
  primary_action: Create Event Function
table:
  selection: multi
  filter: property
  pagination: true
  columns: [Function name, Description, Package type, Runtime, Type, Last modified]
  empty:
    title: No functions
    action: Create Event Function
