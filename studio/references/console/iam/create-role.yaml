# Reference spec of "Create role": the AWS console's wizard that "Create role" on the Roles page opens, with the
# trusted entity type "AWS service" chosen (the type chosen when the wizard opens, requirement R6.3).
# Sources: no capture shows the wizard. The AWS user guide (IAM User Guide) gives the sections and fields of every
# step and the button; the three step titles are those of the wizard example in
# studio/references/console-reference.md; "Role details" is Studio's own title and "Add tags" the guide's label
# on another IAM resource's create page (decisions-needed.md, question 2). Each item's source:
# create-role.sources.md.
# "Set permissions boundary" is an item: the emulator stores a boundary given at creation, so the section cannot
# be `omitted`. This issue leaves it unbuilt (one unmatched item); requirement R3, R13 item 1.
# Nothing is omitted: the emulator (aws-emulator 1.0.481) holds everything these items show.
screen: iam.create-role
service: iam
kind: wizard
route: /aws/iam/roles/create

breadcrumbs: [EmuForge, AWS, IAM, Roles, Create role]
steps:
  - title: Select trusted entity
    sections:
      - title: Trusted entity type
        fields:
          - label: Service or use case
            control: text
            required: true
  - title: Add permissions
    sections:
      - title: Permissions policies
      - title: Set permissions boundary
  - title: Name, review, and create
    sections:
      - title: Role details
        fields:
          - label: Role name
            control: text
            required: true
          - label: Description
            control: text area
            required: false
      - title: "Step 1: Select trusted entities"
      - title: "Step 2: Add permissions"
      - title: Add tags
submit: Create role
