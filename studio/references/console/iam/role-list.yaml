# Reference spec of the IAM role list: the AWS console's "Roles" page.
# Source: the owner's capture of the English console, docs/aws-console/iam/02-roles (the page with rows, and its
# dialog "Delete 0 roles?"). Each item's source: role-list.sources.md.
# Nothing is omitted: the emulator (aws-emulator 1.0.481) holds everything these items show.
# "Roles Anywhere" is an item: the emulator answers IAM Roles Anywhere (`ListTrustAnchors`, `ListProfiles` 200), so
# the panel cannot be `omitted`. This issue leaves it unbuilt (one unmatched item); requirement R3 row 10, R13
# item 12.
# Not in this spec: the sorting controls of "Role name" and "Last activity" (`ListRoles` takes no sort parameter;
# requirement R3 row 8), the badge button "Service-Linked Role", "Info", "Preferences", the side navigation and the
# delete dialog (the format has no item for them; requirement R3, R7).
screen: iam.role-list
service: iam
kind: table
route: /aws/iam/roles

breadcrumbs: [EmuForge, AWS, IAM, Roles]
header:
  title: Roles
  counter: true
  actions: [Refresh roles, Delete, Create role]
  primary_action: Create role
table:
  selection: multi
  filter: text
  pagination: true
  columns: [Role name, Trusted entities, Last activity]
  empty:
    title: No roles
    action: Create role
sections:
  - title: Roles Anywhere
